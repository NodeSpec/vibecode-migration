# Reads the rules GitHub actually enforces on staging and main and compares them with
# .github/rulesets/*.json. Runs weekly and by hand (Actions > rules-audit > Run workflow), and the
# owner runs it right after applying a ruleset. Not on pull requests: a pull request that edits a
# ruleset file would always fail it, because the live rules only change after the file merges and the
# owner applies it. It fails closed. No secret is needed: it reads with the workflow's own token.
name: Rules audit

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Compare the live rules with .github/rulesets/*.json
        run: node scripts/ci/rules-audit.mjs
        env:
          GH_TOKEN: ${{ github.token }}
