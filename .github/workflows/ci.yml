# Runs the app's own checks, then the blueprint's checks, on every pull request into staging or main.
# The job name `test` is an interface: the rulesets require a check called exactly `test`.
name: CI

on:
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The blueprint's own checks: workflow rules, action pins, the app contract and the health check.
      - run: npm run test:pipeline
