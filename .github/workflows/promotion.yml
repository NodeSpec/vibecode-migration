# Rulesets cannot restrict which branch a pull request comes from, so this required check does:
# a pull request into main passes only when it comes from the staging branch of this repository.
# The job name `promotion-source` is an interface: the main ruleset requires exactly that name.
name: Promotion source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promotion-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the staging branch of this repository as the source
        # Branch names are passed through the environment, never written into the script.
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "staging" ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::Pull requests into main must come from the staging branch of this repository. This one comes from '$HEAD_REF' in '$HEAD_REPO'."
            exit 1
          fi
          echo "Promotion from staging: OK"
